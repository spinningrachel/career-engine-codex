name: Validate Codex and ChatGPT ports
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
      - name: Install CLI for the offline runtime smoke check
        run: npm install -g @openai/codex@0.163.0
      - name: Verify prepared tools survive a reset shell environment
        run: |
          python3 tools/ci-runtime.py record
          env -i HOME="$HOME" PATH=/usr/bin:/bin /usr/bin/python3 tools/ci-runtime.py check
      - run: bash tools/validate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: career-engine-packages
          path: |
            career-engine-codex.zip
            career-engine-chatgpt.zip
            career-engine-chatgpt-plugin.zip
            chatgpt-plugin-version.json
