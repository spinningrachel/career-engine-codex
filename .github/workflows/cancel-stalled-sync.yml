name: Cancel stalled sync 39280874883
on:
  push:
    branches: [ops/cancel-stalled-sync-39280874883]
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Stop the explicitly authorized stalled run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          state=$(gh api repos/spinningrachel/career-engine-codex/actions/runs/39280874883 --jq .status)
          if [ "$state" = completed ]; then
            echo 'Run already completed.'
          else
            gh api --method POST repos/spinningrachel/career-engine-codex/actions/runs/39280874883/force-cancel
          fi
